name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Extract changelog section for this tag
        id: changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          body=$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$body" ]; then
            body="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) or commit history for details."
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$body"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build chronos-cli (release)
        run: cargo build --release -p chronos-cli

      - name: Stage chronos-cli binary for upload
        shell: bash
        run: |
          mkdir -p dist-cli
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp target/release/chronos-cli.exe dist-cli/chronos-cli-windows-x86_64.exe
          else
            cp target/release/chronos-cli dist-cli/chronos-cli-linux-x86_64
          fi

      - name: Build chronos-proofhub-plugin (release)
        run: cargo build --release -p chronos-proofhub-plugin

      - name: Stage and sign the ProofHub plugin binary
        shell: bash
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.PLUGIN_SIGNING_PRIVATE_KEY }}
          SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PLUGIN_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p dist-plugin
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            asset=dist-plugin/chronos-proofhub-plugin-windows-x86_64.exe
            cp target/release/chronos-proofhub-plugin.exe "$asset"
          else
            asset=dist-plugin/chronos-proofhub-plugin-linux-x86_64
            cp target/release/chronos-proofhub-plugin "$asset"
          fi
          # rsign/minisign only take the decryption password via an
          # interactive TTY prompt, which this runner doesn't have — see
          # xtask/src/sign_file.rs for why this uses the minisign crate
          # directly instead of a CLI.
          cargo run --release -p xtask --bin sign-file -- "$asset" "$asset.minisig"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Chronos ${{ github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false

      - name: Attach chronos-cli and proofhub-plugin binaries to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ github.ref_name }}" dist-cli/* dist-plugin/* --clobber --repo "${{ github.repository }}"

      # linuxdeploy bundles a few host libraries (libwayland-client,
      # libxcb-render/-shm, libxkbcommon) that its own excludelist doesn't
      # cover — on a host with a newer Mesa than whatever built those
      # bundled copies, the mismatch crashes WebKitWebProcess with "Could
      # not create default EGL display: EGL_BAD_PARAMETER" the moment the
      # window tries to render (window opens, stays blank). See
      # packaging/appimage/strip-bundled-libs.sh and CHANGELOG.md.
      #
      # tauri-action already built + signed + uploaded the (broken)
      # AppImage above; this fixes it in place and re-signs it, since the
      # embedded latest.json signature has to match the new bytes exactly
      # or every install's self-updater rejects the file.
      - name: Fix the AppImage's over-bundled libraries and re-sign it
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)"
          packaging/appimage/strip-bundled-libs.sh "$appimage"
          cargo run --release -p xtask --bin sign-file -- "$appimage" "$appimage.sig"

          gh release download "${{ github.ref_name }}" -p latest.json -O latest.json --clobber --repo "${{ github.repository }}"
          python3 packaging/appimage/patch-latest-json.py latest.json "$(base64 -w0 "$appimage.sig")"

          gh release upload "${{ github.ref_name }}" "$appimage" "$appimage.sig" latest.json --clobber --repo "${{ github.repository }}"
