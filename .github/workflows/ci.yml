name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

      - name: Build web version
        run: npx vite build --mode web

      - name: Keep Tauri imports inside src/platform/tauri.ts
        if: matrix.os == 'ubuntu-latest'
        run: |
          offenders=$(grep -rlE "from \"@tauri-apps/|import\(\"@tauri-apps/" src --include=*.ts --include=*.tsx | grep -vx "src/platform/tauri.ts" || true)
          if [ -n "$offenders" ]; then
            echo "Import Tauri APIs through @platform (see src/platform/types.ts), not directly in:"
            echo "$offenders"
            exit 1
          fi

      - name: Check Rust workspace (desktop app + CLI)
        run: cargo check --workspace

      - name: Run CLI tests
        run: cargo test -p chronos-cli
