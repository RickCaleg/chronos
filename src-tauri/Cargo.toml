[package]
name = "chronos"
version = "0.6.1"
description = "A manual, local-first time tracker built with Tauri and React."
authors = ["Richardson Calegari Saconi"]
license = "MIT"
repository = "https://github.com/RickCaleg/chronos"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chronos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# sqlx-macros is a proc-macro crate, so Cargo resolves its dependency graph
# (host-side) separately from the normal target graph — the [dependencies]
# entry below only forces "bundled" for the runtime target build. Without
# this duplicate here too, sqlx-macros' own copy of libsqlite3-sys still
# links the system SQLite and can fail with the same `sqlite3_unlock_notify`
# error even though the final binary's copy is bundled.
libsqlite3-sys = { version = "0.30", features = ["bundled", "unlock_notify"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2"

# ProofHub integration (docs/proofhub-integration.md): downloading and
# signature-verifying the separate chronos-proofhub-plugin binary, and
# encrypting its credentials at rest. rustls-tls (not the default
# OpenSSL-backed TLS) for the same reason as the plugin binary itself —
# avoiding another native-linking surface after the SQLite/appindicator
# lessons from earlier releases.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
minisign-verify = "0.2"
aes-gcm = "0.10"
rand = "0.8"

# tauri-plugin-sql's sqlite feature links the system libsqlite3 by default,
# which is fragile across distros (e.g. a clean build failed on Arch with an
# undefined `sqlite3_unlock_notify` symbol). Force the vendored/bundled
# SQLite instead, same as chronos-cli already does, for a build that doesn't
# depend on the host's SQLite version or how it was compiled. `unlock_notify`
# is required too: sqlx-sqlite calls sqlite3_unlock_notify() unconditionally,
# but that function only exists in SQLite's amalgamation when compiled with
# SQLITE_ENABLE_UNLOCK_NOTIFY — which libsqlite3-sys's "bundled" feature does
# NOT set by default (unlike most distro-packaged libsqlite3.so, which do).
libsqlite3-sys = { version = "0.30", features = ["bundled", "unlock_notify"] }
