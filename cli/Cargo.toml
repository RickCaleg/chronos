[package]
name = "chronos-cli"
version = "0.3.7"
description = "Command-line companion for the Chronos time tracker"
authors = ["Richardson Calegari Saconi"]
license = "MIT"
repository = "https://github.com/RickCaleg/chronos"
edition = "2021"

[[bin]]
name = "chronos-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
