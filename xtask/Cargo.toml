[package]
name = "xtask"
version = "0.0.0"
description = "CI-only helpers (not shipped): non-interactive minisign signing, since the rsign/minisign CLIs only accept the signing password via an interactive TTY prompt."
publish = false
edition = "2021"

[[bin]]
name = "sign-file"
path = "src/sign_file.rs"

[dependencies]
minisign = "0.9"
base64 = "0.22"
