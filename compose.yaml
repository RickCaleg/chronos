# Chronos web. Settings come from `.env` (copy .env.example). See docs/WEB.md.
#   Prebuilt image:   docker compose pull && docker compose up -d
#   Build from repo:  docker compose up -d --build
services:
  chronos:
    image: ghcr.io/rickcaleg/chronos-web:${CHRONOS_VERSION:-latest}
    build: .
    restart: unless-stopped
    # Caddy only needs to bind ports and write its two volumes.
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      CHRONOS_ADDRESS: ${CHRONOS_ADDRESS:-:80}
    ports:
      - "${CHRONOS_HTTP_PORT:-80}:80"
      - "${CHRONOS_HTTPS_PORT:-443}:443"
      - "${CHRONOS_HTTPS_PORT:-443}:443/udp"
    volumes:
      # TLS certificates and keys; keeping them avoids re-issuing on every restart.
      - caddy_data:/data
      - caddy_config:/config

  # Cloudflare Tunnel: publishes the site through Cloudflare with no open ports
  # on the router. Enabled with COMPOSE_PROFILES=tunnel in .env; the tunnel's
  # public hostname must point at http://chronos:80.
  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - chronos

volumes:
  caddy_data:
  caddy_config:
